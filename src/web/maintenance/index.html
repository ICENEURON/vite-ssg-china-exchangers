<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0e131c" />
  <title>Website Update in Progress | HeatEx Direct</title>
  <style>
    :root {
      --navbar: #0e131c;
      --navbar-foreground: #f4f9fe;
      --muted: rgba(244, 249, 254, 0.72);
      --line: rgba(244, 249, 254, 0.18);
      --accent: #f0762b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: 28px;
      background: var(--navbar);
      color: var(--navbar-foreground);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 30px;
      width: min(620px, 100%);
      text-align: center;
      transform: translateY(-2vh);
    }

    .brand {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand span {
      color: var(--accent);
    }

    .clock {
      position: relative;
      width: 108px;
      height: 108px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(244, 249, 254, 0.04);
      box-shadow: inset 0 0 0 10px rgba(244, 249, 254, 0.03);
    }

    .clock::before {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      left: calc(50% - 1px);
      bottom: 50%;
      width: 2px;
      height: 40px;
      border-radius: 99px;
      background: var(--accent);
      transform-origin: 50% 100%;
      animation: tick 12s linear infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 54px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      max-width: 540px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2.6vw, 20px);
      line-height: 1.7;
    }

    @keyframes tick {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 22px;
      }

      main {
        gap: 24px;
        transform: none;
      }

      .clock {
        width: 92px;
        height: 92px;
      }

      .hand {
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="maintenance-title">
    <div class="brand">HeatEx <span>Direct</span></div>
    <div class="clock" aria-hidden="true"><span class="hand"></span></div>
    <h1 id="maintenance-title">Website update in progress</h1>
    <p>We are updating the website content, and access should be restored in about 5 minutes.</p>
  </main>
</body>
</html>
