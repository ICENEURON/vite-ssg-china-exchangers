<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var gaMeasurementId = '__VITE_GA_MEASUREMENT_ID__';
        var analyticsHostname = '__VITE_ANALYTICS_HOSTNAME__';

        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function(){window.dataLayer.push(arguments);};
        window.gtag('consent', 'default', {
          ad_personalization: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          analytics_storage: 'denied',
          wait_for_update: 500
        });

        function normalizeHostname(hostname) {
          return String(hostname || '').toLowerCase().replace(/^www\./, '');
        }

        if (
          gaMeasurementId &&
          analyticsHostname &&
          normalizeHostname(window.location.hostname) === normalizeHostname(analyticsHostname)
        ) {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaMeasurementId);
          document.head.appendChild(script);

          window.gtag('js', new Date());
          window.gtag('config', gaMeasurementId, {
            send_page_view: false
          });
          window.__HEATEX_GA_BOOTSTRAPPED__ = true;
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      window.__ENV__ = {
        DEFAULT_LANGUAGE: '__VITE_DEFAULT_LANGUAGE__',
        SUPPORTED_LANGUAGES: '__VITE_SUPPORTED_LANGUAGES__',
        ENABLE_LANGUAGE_TOGGLE: '__VITE_ENABLE_LANGUAGE_TOGGLE__',
      };
    </script>
    <script src="/init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
